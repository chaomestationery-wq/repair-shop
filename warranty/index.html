<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ประกันของฉัน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ประกันของฉัน">
<style>
:root{--a:#0f766e;--c:#0f766e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font:17px system-ui,-apple-system,sans-serif;color:#1e293b;min-height:100vh;background:radial-gradient(circle at 1px 1px,#0f766e14 1.2px,transparent 1.4px) 0 0/24px 24px,linear-gradient(180deg,#99f6e4,#f0fdfa 260px,#f8fafc);background-attachment:fixed;overflow-x:hidden}
.wrap{max-width:480px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 48px)}

/* Header & Logo Shine */
.top{display:flex;align-items:center;gap:10px;color:#064e3b;margin:4px 2px 16px}
.lg{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 6px 16px #0f766e33;position:relative;overflow:hidden}
.lg::after{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,#ffffff44 50%,transparent 60%);animation:shine 4s infinite}
@keyframes shine{0%{transform:translateX(-100%) rotate(45deg)}30%,100%{transform:translateX(100%) rotate(45deg)}}
.top h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-0.3px}
.help-btn{background:#fff;border:1.5px solid #99f6e4;color:#0f766e;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 3px 10px #0f766e14;padding:0;transition:all .2s}
.help-btn:active{transform:scale(0.9)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#fff;color:#0f766e;padding:5px 10px;border-radius:20px;box-shadow:0 1px 6px #0001}
.live i{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pl 1.4s infinite}
.live.off i{background:#dc2626;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 #16a34a88}100%{box-shadow:0 0 0 9px #16a34a00}}

/* Cards & Stagger Animation */
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #0f766e12;border:1px solid #e6f4f1;animation:up .4s cubic-bezier(0.16,1,0.3,1) both}
.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* Empty State Hero */
.hero{text-align:center;border-top:6px solid var(--c);position:relative;overflow:hidden;padding:28px 18px}
.hero .em{font-size:68px;line-height:1.1;animation:bob 2.6s ease-in-out infinite;margin-bottom:8px;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.hero h2{margin:6px 0 6px;font-size:23px;color:var(--c);font-weight:800}
.hero p{margin:0;color:#64748b;font-size:15px;line-height:1.6}

/* Key-Value List */
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed #e2e8f0;font-size:15px}
.kv:last-child{border:0}.kv span{color:#64748b}.kv b{text-align:right;color:#0f172a}
h3{margin:0 0 6px;font-size:18px;color:#0f766e;font-weight:800}

/* Buttons with Ripple/Shimmer */
button{font:inherit;font-weight:700;width:100%;padding:15px;border:0;border-radius:15px;color:#fff;background:linear-gradient(120deg,#0f766e,#14b8a6);box-shadow:0 6px 18px #0f766e3b;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
button:active{transform:scale(.97);box-shadow:0 2px 8px #0f766e33}
button.scan-main::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);animation:btnSweep 3.5s infinite}
@keyframes btnSweep{0%{left:-100%}35%,100%{left:150%}}
button.s{background:#fff;color:#0f766e;border:2px solid #99f6e4;box-shadow:none}
button.g{background:transparent;color:#64748b;box-shadow:none;padding:10px}

/* Countdown Ring & Pulse */
.ring{position:relative;width:224px;height:224px;margin:10px auto}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 4px 10px var(--c)22)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .dd{font-size:54px;font-weight:800;line-height:1;color:var(--c);letter-spacing:-1.5px;transition:transform .2s}
.ring .dl{color:#64748b;font-size:14px;font-weight:600;margin-top:2px}
.ring .tm{font-size:21px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;color:#334155;background:#f8fafc;padding:3px 12px;border-radius:10px;border:1px solid #e2e8f0}

.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 16px;border-radius:20px;color:#fff;font-weight:700;background:var(--c);font-size:14px;box-shadow:0 3px 10px var(--c)44}
.bar{height:10px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar div{height:100%;background:linear-gradient(90deg,var(--c),#5eead4);border-radius:8px;transition:width 1s ease-out}
.pc{font-size:13px;color:#64748b;font-weight:500}
.rm{text-align:center;font-size:14px;color:#94a3b8;margin-top:12px}
.rm a{color:#0f766e;font-weight:600;cursor:pointer;padding:8px}
.mu{font-size:13px;color:#94a3b8;text-align:center;margin-top:10px;line-height:1.5}

/* Accordion Summary */
.sm{display:flex;align-items:center;gap:12px;cursor:pointer;padding:2px 0}
.smi{font-size:22px}
.smx{flex:1;min-width:0}.smx b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1e293b}.smx small{color:#64748b;font-size:13px}
.smd{font-weight:700;color:var(--c);font-size:14px;white-space:nowrap;background:#f0fdfa;padding:4px 10px;border-radius:10px}
.chev{color:#94a3b8;transition:transform .25s;font-size:13px}.open .chev{transform:rotate(180deg)}
.det{margin-top:14px;border-top:1px solid #f1f5f9;padding-top:14px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}}

/* Install Banner */
.ins{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);border:1.5px solid #5eead4}
.ins span{flex:1;font-size:14px;color:#0f766e;font-weight:700;line-height:1.4}
.ins button{width:auto;padding:10px 16px;font-size:14px;flex-shrink:0}

/* Modal & Onboarding Tour Popup */
#ov{position:fixed;inset:0;z-index:20;background:#0f1b2d99;backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;animation:bgFade .2s}
@keyframes bgFade{from{opacity:0}}
.sh{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 22px);animation:sl .28s cubic-bezier(0.16,1,0.3,1);box-shadow:0 -10px 40px #0003}
@keyframes sl{from{transform:translateY(80px);opacity:0}}
.sh h3{font-size:21px;margin-bottom:4px}
.sh .sub{color:#64748b;font-size:15px;margin-bottom:14px}
.sh textarea{width:100%;min-height:96px;margin:8px 0 4px;padding:12px 14px;border:2px solid #99f6e4;border-radius:14px;font:inherit;resize:vertical;color:#1e293b}
.sh textarea:focus{outline:3px solid #14b8a633;border-color:#14b8a6}
.sh button{margin-top:10px}
.sh ol,.sh ul{padding-left:20px;line-height:1.8;margin:8px 0;color:#334155;font-size:15px}
.nt{padding:12px 14px;border-radius:14px;background:#fef3c7;color:#b45309;font-size:14px;margin-top:10px;line-height:1.5;font-weight:500}

/* Interactive Tour Styles */
.tour-card{text-align:center;padding:8px 4px}
.tour-icon{font-size:64px;margin:8px auto 12px;width:104px;height:104px;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);border-radius:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #0f766e1a;animation:popIn .35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0.6);opacity:0}}
.tour-title{font-size:21px;font-weight:800;color:#0f766e;margin:0 0 8px}
.tour-desc{font-size:15px;color:#475569;line-height:1.6;margin:0 0 18px;min-height:72px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:10px;background:#cbd5e1;transition:all .3s}
.dot.on{width:24px;background:#0f766e}
.tour-nav{display:flex;gap:10px}
.tour-nav button{margin-top:0}

/* Toast & Confetti */
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,40px);background:#064e3b;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;z-index:30;max-width:90vw;text-align:center;font-size:15px;box-shadow:0 10px 25px #0003;font-weight:600}
#tt.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;width:9px;height:9px;z-index:50;pointer-events:none;border-radius:2px;animation:fall 1.8s ease-out forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lg">🛡️</div>
    <h1 id="shop">ประกันของฉัน</h1>
    <button class="help-btn" onclick="openTour(0)" title="คู่มือและวิธีใช้งาน">❓</button>
    <span class="live" id="lv" hidden><i></i><b id="lt">LIVE</b></span>
  </div>

  <div id="ins" class="card ins" hidden>
    <span>📲 ติดตั้งไว้บนหน้าจอมือถือ เปิดดูใบประกันได้ทันที</span>
    <button onclick="inst()">ติดตั้ง</button>
  </div>

  <div class="card" style="padding:14px">
    <button class="scan-main" onclick="scan()">📷 สแกน QR เพิ่มใบประกัน</button>
  </div>

  <div id="v"></div>

  <div class="mu" id="up">
    กดปุ่ม <b>📷 สแกน QR</b> ด้านบน หรือกดปุ่ม <b>❓ มุมขวาบน</b> เพื่อดูคู่มือ<br>
    ข้อมูลปลอดภัย บันทึกไว้ในเครื่องของคุณเท่านั้น
  </div>
</div>

<div id="ov" hidden onclick="if(event.target==this)cl()"><div class="sh" id="sh"></div></div>
<div id="tt"></div>

<script>
const $=s=>document.querySelector(s);
const K='chaome_warranty_v1';
const K_TOUR='chaome_warranty_tour_seen';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};
const save=l=>{try{localStorage.setItem(K,JSON.stringify(l))}catch(e){}};
const OK10=s=>/^\d{4}-\d\d-\d\d/.test(String(s||''));
const pdt=(s,sx)=>OK10(s)?new Date(String(s).slice(0,10)+sx):null;
const TDs=s=>{if(!OK10(s))return'-';const[y,m,d]=String(s).slice(0,10).split('-');return(+d)+' '+MT[+m-1]+' '+(+y+543)};
const p2=n=>('0'+n).slice(-2);
const toast=m=>{const t=$('#tt');t.textContent=m;t.className='on';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2600)};

/* ลูกเล่นพลุกระดาษฉลองเมื่อเพิ่มใบประกันสำเร็จ */
function burst(){
  const cols=['#14b8a6','#0f766e','#f59e0b','#3b82f6','#ec4899','#10b981'];
  for(let i=0;i<36;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.top='-10px';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.2+Math.random()*1.2)+'s';
    d.style.animationDelay=(Math.random()*0.3)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2600);
  }
}

let W=load(),CUR=null;
const OPEN=new Set();
const DEF_LINE='@457mwrdi';
W.forEach(w=>{if(!w.ct)w.ct=DEF_LINE});

function addFromParams(P){
  const c=(P.get('w')||'').trim();
  if(!c)return false;
  const o={c:c,n:P.get('n')||'',i:P.get('i')||'',d:P.get('d')||'',s:P.get('s')||'',e:P.get('e')||'',y:P.get('y')||'',
           sn:P.get('sn')||'',tl:P.get('tl')||'',ct:P.get('ct')||DEF_LINE};
  const k=W.findIndex(x=>x.c==c);
  if(k>=0){W[k]=Object.assign(W[k],o);W.unshift(W.splice(k,1)[0])}else W.unshift(o);
  OPEN.clear();OPEN.add(c);
  save(W);
  return true;
}

(function(){
  if(!addFromParams(new URLSearchParams(location.search)))return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  setTimeout(()=>{toast('🎉 เพิ่มใบประกันในแอปเรียบร้อยแล้ว');burst()},350);
})();

function addFromText(t){
  t=String(t||'').trim();
  let q='';
  try{q=new URL(t).search}catch(e){const j=t.indexOf('?');q=j>=0?t.slice(j):(t.indexOf('w=')>=0?t:'')}
  return addFromParams(new URLSearchParams(q));
}

function stOf(w){
  const e=pdt(w.e,'T23:59:59+07:00'),ms=e?e-Date.now():null;
  if(w.v)return'void';if(w.x==='none')return'none';if(ms===null)return'unk';
  return ms<=0?'exp':ms<=7*864e5?'warn':'ok';
}

function render(){
  const l=W.slice();
  if(W.length&&!W.some(x=>OPEN.has(x.c)))OPEN.add(W[0].c);
  const sn=(W.find(x=>x.sn)||{}).sn;
  $('#shop').textContent=sn||'ประกันของฉัน';
  document.title=(sn?sn+' • ':'')+'ประกันของฉัน';
  const kv=(a,b)=>b?`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`:'';
  
  $('#v').innerHTML=l.length?l.map(w=>{
    const i=W.indexOf(w),op=W.length<2||OPEN.has(w.c);
    return `<div class="card wc${op?' open':''}" data-i="${i}">
<div class="sm" ${W.length>1?'':'hidden'} onclick="tg(${i})">
  <span class="smi"></span>
  <div class="smx">
    <b>${esc(w.d||w.i||w.c)}</b>
    <small>${esc(w.c)}${w.i&&w.d?' • '+esc(w.i):''}</small>
  </div>
  <span class="smd"></span>
  <span class="chev">▼</span>
</div>
<div class="det" ${op?'':'hidden'}>
  <div style="text-align:center">
    <div class="pill pl"></div>
    <div class="ring">
      <svg width="224" height="224" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="8.5"/>
        <circle class="rg" cx="60" cy="60" r="54" fill="none" stroke="var(--c)" stroke-width="8.5" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/>
      </svg>
      <div class="in">
        <div class="dd">-</div>
        <div class="dl">วันคงเหลือ</div>
        <div class="tm"></div>
      </div>
    </div>
    <div class="bar"><div class="br"></div></div>
    <div class="pc"></div>
  </div>
  <div style="margin-top:14px">${kv('รหัสประกัน',w.c)}${kv('ลูกค้า',w.n)}${kv('เครื่อง',w.d)}${kv('รายการ',w.i)}${kv('วันที่ออกใบ',OK10(w.s)?TDs(w.s):'')}${kv('หมดประกัน',OK10(w.e)?TDs(w.e):'')}</div>
  <div style="margin-top:16px"><button onclick="claim(${i})">🛠️ แจ้งเคลมประกัน</button></div>
  <div class="rm"><a onclick="cp(${i})">📋 คัดลอกรหัส</a> · <a onclick="del(${i})">🗑️ ลบใบนี้</a></div>
  ${w.t?`<div class="mu" style="margin-top:6px">✓ ตรวจสอบกับระบบร้านล่าสุด ${(d=>TDs(d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())))(new Date(w.t))}</div>`:''}
</div></div>`}).join(''):
'<div class="card hero" style="--c:#0f766e"><div class="em">🛡️</div><h2>ยังไม่มีใบประกันในแอป</h2><p>กดปุ่ม <b>📷 สแกน QR</b> ด้านบนเพื่อสแกนใบรับประกันจากร้าน หรือแตะ <b>❓</b> มุมขวาบนเพื่อดูวิธีใช้งาน</p></div>';
  tick();
}

function tick(){
  document.querySelectorAll('.wc').forEach(c=>{
    const w=W[+c.dataset.i];if(!w)return;
    const s=pdt(w.s,'T00:00:00+07:00'),e=pdt(w.e,'T23:59:59+07:00'),ms=e?e-Date.now():null,tot=(s&&e)?Math.max(1,e-s):1,st=stOf(w);
    let col='#16a34a',t='ประกันยังคุ้มครอง',ic='🛡️ ',frac=ms===null?0:Math.max(0,Math.min(1,ms/tot));
    if(st=='void'){col='#6b7280';t='ใบประกันถูกยกเลิก';ic='🚫 ';frac=0}
    else if(st=='none'){col='#6b7280';t='ไม่พบในระบบร้าน';ic='❓ ';frac=0}
    else if(st=='unk'){col='#6b7280';t='ไม่มีข้อมูลวันหมดประกัน';ic='❓ ';frac=0}
    else if(st=='exp'){col='#dc2626';t='หมดประกันแล้ว';ic='⛔ ';frac=0}
    else if(st=='warn'){col='#f59e0b';t='ใกล้หมดประกัน'}
    c.style.setProperty('--c',col);
    c.querySelector('.pl').textContent=ic+t;
    c.querySelector('.smi').textContent=ic;
    c.querySelector('.smd').textContent=(st=='ok'||st=='warn')?Math.floor(ms/864e5)+' วัน':st=='exp'?'หมดแล้ว':st=='void'?'ยกเลิก':'—';
    c.querySelector('.rg').setAttribute('stroke-dashoffset',339.3*(1-frac));
    c.querySelector('.br').style.width=(frac*100)+'%';
    const dd=c.querySelector('.dd'),tm=c.querySelector('.tm'),pc=c.querySelector('.pc');
    if(st=='ok'||st=='warn'){
      const D=Math.floor(ms/864e5),H=Math.floor(ms%864e5/36e5),M=Math.floor(ms%36e5/6e4),S=Math.floor(ms%6e4/1e3);
      dd.textContent=D;tm.textContent=p2(H)+':'+p2(M)+':'+p2(S);pc.textContent='ใช้งานไปแล้ว '+Math.round((1-frac)*100)+'% ของระยะประกัน';
    }else{
      dd.textContent=st=='exp'?'0':'—';tm.textContent=st=='exp'?'หมดอายุแล้ว':'';pc.textContent='';
    }
  });
}
setInterval(tick,1000);

function tg(i){const c=W[i].c;if(OPEN.has(c))OPEN.delete(c);else OPEN.add(c);render()}
function cp(i){copy(W[i].c).then(()=>toast('📋 คัดลอกรหัสประกันแล้ว'))}
function del(i){if(confirm('ต้องการลบใบประกันนี้ออกจากแอป?\n(คุณสามารถสแกน QR ใหม่เพื่อเพิ่มกลับได้ตลอดเวลา)')){W.splice(i,1);save(W);render();toast('🗑️ ลบใบประกันแล้ว')}}
async function copy(t){
  try{await navigator.clipboard.writeText(t)}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}
}

/* ----- ป็อปอัปสอนการใช้งานแบบ Step-by-Step (Onboarding Tour) ----- */
const STEPS=[
  {
    ic:'👋',
    t:'ยินดีต้อนรับสู่ "ประกันของฉัน"',
    d:'ผู้ช่วยเก็บใบรับประกันดิจิทัลบนมือถือ ไม่ต้องกลัวใบเสร็จหายหรือหมึกจาง เช็กวันหมดอายุได้แบบเรียลไทม์ทุกที่ทุกเวลา'
  },
  {
    ic:'📷',
    t:'1. สแกน QR เพิ่มใบประกัน',
    d:'กดปุ่ม <b>"📷 สแกน QR เพิ่มใบประกัน"</b> แล้วส่องกล้องไปที่ QR Code บนใบรับประกันจากทางร้าน ข้อมูลจะถูกบันทึกเข้าเครื่องทันที'
  },
  {
    ic:'⏳',
    t:'2. เช็กวันคุ้มครองแบบนับถอยหลัง',
    d:'วงแหวนสีเขียวบอกจำนวนวันที่เหลืออยู่ชัดเจน หากขึ้น <b>สีส้ม</b> คือใกล้หมดอายุ (≤7 วัน) และ <b>สีแดง</b> คือหมดระยะประกันแล้ว'
  },
  {
    ic:'🛠️',
    t:'3. แจ้งเคลมง่ายๆ ในคลิกเดียว',
    d:'หากสินค้ามีปัญหา กดปุ่ม <b>"🛠️ แจ้งเคลมประกัน"</b> พิมพ์อาการเสีย ระบบจะสร้างข้อความพร้อมรหัสประกันส่งเข้า LINE ร้านให้อัตโนมัติ!'
  }
];

function openTour(step=0){
  const s=STEPS[step];
  const isLast=step===STEPS.length-1;
  const dots=STEPS.map((_,idx)=>`<span class="dot${idx===step?' on':''}"></span>`).join('');
  open_(`
  <div class="tour-card">
    <div class="tour-icon" key="${step}">${s.ic}</div>
    <div class="tour-title">${s.t}</div>
    <div class="tour-desc">${s.d}</div>
    <div class="dots">${dots}</div>
    <div class="tour-nav">
      ${step>0?`<button class="s" style="flex:1" onclick="openTour(${step-1})">← ย้อนกลับ</button>`:`<button class="g" style="flex:1" onclick="finishTour()">ข้าม</button>`}
      ${isLast?`<button style="flex:2" onclick="finishTour()">เริ่มใช้งานเลย! 🚀</button>`:`<button style="flex:2" onclick="openTour(${step+1})">ถัดไป →</button>`}
    </div>
  </div>`);
}

function finishTour(){
  try{localStorage.setItem(K_TOUR,'1')}catch(e){}
  cl();
}

/* ----- เคลม ----- */
const cl=()=>{stopScan();$('#ov').hidden=true};
const open_=h=>{stopScan();$('#sh').innerHTML=h;$('#ov').hidden=false};

function lineId(ct){
  ct=String(ct||'').trim();
  if(/^@[\w.\-]+$/.test(ct))return ct;
  const m=/line\.me\/(?:R\/)?ti\/p\/(?:%40|@)([\w.\-]+)/i.exec(ct);
  return m?'@'+m[1]:'';
}

function msg(w,pb){
  const st=stOf(w);
  return '🛡️ ขอแจ้งเคลมประกัน\n'+
    'รหัสประกัน: '+w.c+(w.n?'\nชื่อลูกค้า: '+w.n:'')+
    '\n📱 เครื่อง/รุ่น: '+(w.d||'-')+
    '\n🔧 รายการซ่อม: '+(w.i||'-')+
    '\n📅 วันที่ออกใบ: '+(OK10(w.s)?TDs(w.s):'-')+
    '\n⏳ หมดประกัน: '+TDs(w.e)+(st=='exp'?' (หมดอายุแล้ว)':'')+
    '\n❗ อาการที่เป็น: '+(pb||'');
}

function claim(i){
  CUR=i;const w=W[i],st=stOf(w),ct=(w.ct||'').trim(),tl=(w.tl||'').replace(/[^\d+]/g,'');
  open_(`<h3>🛠️ แจ้งเคลมประกัน</h3><div class="sub">${esc(w.i||'')} • รหัส ${esc(w.c)}</div>
${st=='exp'?'<div class="nt">⚠️ ใบประกันนี้หมดอายุแล้ว ร้านอาจมีค่าใช้จ่ายเพิ่มเติมในการซ่อม</div>':''}
${st=='void'?'<div class="nt">🚫 ใบประกันนี้ถูกยกเลิกในระบบ กรุณาติดต่อร้านค้าเพื่อสอบถาม</div>':''}
<textarea id="pb" placeholder="พิมพ์อาการเสียคร่าวๆ เช่น จอเป็นเส้น ทัชสกรีนไม่ได้..."></textarea>
${lineId(ct)?'<button onclick="sendLine()">💬 ส่งเรื่องเคลมทาง LINE (พร้อมอาการ)</button>':''}
${/^https?:/i.test(ct)&&!lineId(ct)?'<button onclick="sendLink()">💬 เปิดแชทร้าน (คัดลอกข้อความให้)</button>':''}
${tl?'<button class="s" onclick="callShop()">📞 โทรหาร้าน</button><button class="s" onclick="sendSms()">✉️ ส่ง SMS</button>':''}
<button class="s" onclick="copyMsg()">📋 คัดลอกข้อความเคลม</button>
<button class="g" onclick="cl()">ปิด</button>`);
}

const cur=()=>W[CUR],pb=()=>($('#pb').value||'').trim();
function sendLine(){
  const w=cur(),p=pb();
  if(!p){toast('กรุณาพิมพ์อาการเสียก่อนส่งครับ');$('#pb').focus();return}
  const t=msg(w,p);copy(t);
  location.href='https://line.me/R/oaMessage/'+lineId(w.ct)+'/?'+encodeURIComponent(t);
}
async function sendLink(){const w=cur();await copy(msg(w,pb()));toast('คัดลอกข้อความแล้ว วางในแชทร้านได้เลย');window.open(w.ct,'_blank','noopener')}
function callShop(){location.href='tel:'+cur().tl.replace(/[^\d+]/g,'')}
function sendSms(){const w=cur();location.href='sms:'+w.tl.replace(/[^\d+]/g,'')+'?body='+encodeURIComponent(msg(w,pb()))}
async function copyMsg(){await copy(msg(cur(),pb()));toast('📋 คัดลอกข้อความเคลมแล้ว')}

/* ----- สแกน QR ----- */
let SCS=null,SCT=0;
function stopScan(){SCT=0;if(SCS){SCS.getTracks().forEach(t=>t.stop());SCS=null}}
function loadJsQR(){
  return new Promise(r=>{
    if(window.jsQR)return r();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload=()=>r();s.onerror=()=>r();document.head.appendChild(s);
  });
}
function scanNote(t){const n=$('#scn');if(n){n.textContent=t;n.hidden=false}}
function pasteLink(){
  stopScan();
  const t=prompt('วางลิงก์ใบประกันที่ได้รับจากร้านค้า:');
  if(t==null)return;
  if(addFromText(t)){cl();render();toast('🎉 เพิ่มใบประกันในแอปแล้ว');burst()}
  else toast('❌ ลิงก์นี้ไม่ใช่ใบประกันที่ถูกต้อง');
}
async function scan(){
  open_(`<h3>📷 สแกน QR ใบประกัน</h3><div class="sub">หันกล้องไปที่ QR Code บนใบรับประกัน</div>
<video id="sv" playsinline muted style="width:100%;border-radius:16px;margin-top:10px;background:#000;aspect-ratio:1/1;object-fit:cover"></video>
<div class="nt" id="scn" hidden></div>
<button class="s" onclick="pasteLink()">🔗 วางลิงก์ใบประกันแทน</button>
<button class="g" onclick="cl()">ปิด</button>`);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanNote('เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาใช้ปุ่ม "วางลิงก์แทน"');return}
  try{SCS=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){scanNote('ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การอนุญาตกล้อง');return}
  const v=$('#sv');if(!v){stopScan();return}
  v.srcObject=SCS;try{await v.play()}catch(e){}
  let det=null;
  if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det)await loadJsQR();
  if(!det&&!window.jsQR){scanNote('ไม่สามารถโหลดตัวถอดรหัส QR ได้ กรุณาใช้ "วางลิงก์แทน"');return}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),id=++SCT;
  const loop=async()=>{
    if(SCT!==id||!SCS)return;
    let txt='';
    try{
      if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue}
      else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height);if(r)txt=r.data}
    }catch(e){}
    if(txt){
      if(addFromText(txt)){cl();render();toast('🎉 เพิ่มใบประกันในแอปแล้ว');burst();return}
      scanNote('⚠️ QR นี้ไม่ใช่ใบประกันของร้าน กรุณาลองใหม่');
    }
    setTimeout(loop,det?200:300);
  };
  loop();
}

/* ----- PWA Install ----- */
let DP=null;
const SA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(!SA())$('#ins').hidden=false});
addEventListener('appinstalled',()=>{$('#ins').hidden=true;toast('ติดตั้งแอปสำเร็จ')});
if(!SA())$('#ins').hidden=false;
async function inst(){
  if(DP){DP.prompt();try{await DP.userChoice}catch(e){}DP=null;return}
  open_(`<h3>📲 ติดตั้งแอปไว้บนหน้าจอ</h3><ol>${IOS
    ?'<li>เปิดหน้านี้ในเบราว์เซอร์ <b>Safari</b></li><li>แตะปุ่ม <b>แชร์</b> (ไอคอนลูกศรชี้ขึ้น)</li><li>เลื่อนหาเมนู <b>"เพิ่มไปยังหน้าจอโฮม"</b> (Add to Home Screen)</li><li>แตะ <b>เพิ่ม</b> เป็นอันเสร็จสิ้น</li>'
    :'<li>แตะเมนู <b>⋮</b> (มุมขวาบนของ Chrome)</li><li>เลือกเมนู <b>"ติดตั้งแอป"</b> หรือ <b>"เพิ่มลงในหน้าจอหลัก"</b></li><li>แตะ <b>ติดตั้ง</b> เพื่อยืนยัน</li>'}</ol><button onclick="cl()">เข้าใจแล้ว</button>`);
}

/* ----- ซิงค์ข้อมูลสด (ถ้ามี API) ----- */
const API='';
let SB=0;
function live(ok){
  if(!API){$('#lv').hidden=true;return}
  $('#lv').hidden=false;$('#lv').className='live'+(ok?'':' off');$('#lt').textContent=ok?'LIVE':'ออฟไลน์';
}
async function syncAll(){
  if(!API||SB)return;SB=1;
  try{
    let ok=0;
    for(const w of W){
      try{
        const r=await fetch(API+(API.indexOf('?')<0?'?':'&')+'api=w&w='+encodeURIComponent(w.c),{cache:'no-store'}),d=await r.json();
        if(d&&d.none){w.x='none';w.v=0}
        else if(d&&d.code){
          w.x='';w.v=d.void?1:0;
          if(d.start)w.s=d.start;if(d.end)w.e=d.end;if(d.name)w.n=d.name;
          if(d.item)w.i=d.item;if(d.device)w.d=d.device;if(d.shop)w.sn=d.shop;
        }else continue;
        w.t=Date.now();ok++;
      }catch(e){}
    }
    if(ok)save(W);
    live(navigator.onLine&&(!W.length||ok>0));
    render();
  }finally{SB=0}
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();syncAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();syncAll()}});

/* แสดงป็อปอัปสอนใช้งานอัตโนมัติเมื่อลูกค้าเข้าเว็บครั้งแรก */
if(!localStorage.getItem(K_TOUR)){
  setTimeout(()=>openTour(0), 600);
}
</script>
