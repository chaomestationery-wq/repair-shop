<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แจ้งซ่อมมือถือ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Noto Sans Thai',sans-serif;background:#f4f6f8;color:#1b2430;font-size:16px}
.w{max-width:560px;margin:auto;padding:14px}
.c{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{margin:0;background:#fff;color:#1b2430;border:1px solid #e2e8f0}
.tabs button.on{background:#06c755;color:#fff;border-color:#06c755}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:#64748b;margin:0 0 8px;font-size:15px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dc;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:76px}
input:focus,textarea:focus{outline:0;border-color:#06c755;box-shadow:0 0 0 3px rgba(6,199,85,.15)}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#06c755;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.s{background:#eef1f5;color:#1b2430}
button:disabled{opacity:.6}
#map{height:260px;border-radius:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#msg,#smsg{margin:10px 0 0;font-weight:600}
#gm{margin:8px 0 0;font-size:14px;color:#64748b}
.code{font-size:38px;font-weight:800;letter-spacing:4px;text-align:center;background:#effaf3;border:2px dashed #06c755;border-radius:14px;padding:14px;margin:12px 0;user-select:all}
.ok{text-align:center}.ok .ck{width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;font-size:36px;line-height:64px;margin:4px auto 6px}
small{color:#64748b}
.shop{color:#64748b;font-size:14px;margin:2px 0 8px}
.rc{font-size:26px;font-weight:800;letter-spacing:3px}
.chip{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;background:#dbeafe;color:#1d4ed8;font-weight:700}
.chip.live{background:#fef3c7;color:#b45309}.chip.fin{background:#dcfce7;color:#15803d}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 16px 28px;color:#94a3b8}
.tl li:before{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:#cbd5e1}
.tl li:after{content:"";position:absolute;left:11px;top:20px;bottom:-4px;width:2px;background:#e2e8f0}
.tl li:last-child:after{display:none}
.tl .d{color:#1b2430}.tl .d:before{background:#06c755}.tl .d:after{background:#86efac}
.tl .n{color:#1b2430;font-weight:700}.tl .n:before{background:#2563eb;box-shadow:0 0 0 5px rgba(37,99,235,.18)}
.tl small{display:block;color:#64748b;font-weight:400;font-size:13px}
#m2{height:300px;border-radius:10px;margin-top:8px}
#lt{display:block;margin-top:6px;color:#64748b;font-size:14px}
[hidden]{display:none!important}
</style></head><body><div class="w">

<div class="tabs"><button id="t1" class="on">🔧 แจ้งซ่อม</button><button id="t2">🔎 เช็คสถานะ</button></div>

<!-- ============ แจ้งซ่อม ============ -->
<div id="p1">
<div id="f" class="c">
  <h1>🔧 แจ้งซ่อมมือถือ</h1>
  <p class="sub">กรอกข้อมูล ร้านจะติดต่อกลับโดยเร็ว</p>
  <label>ชื่อ *</label><input id="nm" autocomplete="name" maxlength="80">
  <label>เบอร์โทร *</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
  <label>รุ่นเครื่อง / อาการเสีย *</label><textarea id="dv" maxlength="200" placeholder="เช่น iPhone 13 จอแตก"></textarea>
  <label>ที่อยู่สำหรับรับ-ส่ง *</label><textarea id="ad" maxlength="300"></textarea>
  <label>ปักหมุดตำแหน่ง (ไม่บังคับ)</label>
  <button type="button" class="s" id="gps" style="margin-top:0">📍 ใช้ตำแหน่งปัจจุบันของฉัน</button>
  <div id="gm">หรือแตะแผนที่ / ลากหมุดเพื่อเลือกตำแหน่งเอง</div>
  <div id="map" style="margin-top:8px"></div>
  <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="button" id="go">ส่งข้อมูลแจ้งซ่อม</button>
  <p id="msg"></p>
</div>

<div id="done" class="c ok" hidden>
  <div class="ck">✓</div>
  <h1>รับเรื่องแล้ว</h1>
  <p class="sub">รหัสงานของคุณ (กรุณาจดหรือแคปหน้าจอไว้)</p>
  <div class="code" id="cd"></div>
  <button type="button" id="cp">📋 คัดลอกรหัส</button>
  <button type="button" class="s" id="tr">🔎 ดูสถานะงาน</button>
  <p><small>เช็คสถานะได้ทุกเมื่อ โดยใช้รหัสงาน + เบอร์โทร 4 ตัวท้าย</small></p>
  <button type="button" class="s" id="again">แจ้งซ่อมเครื่องอื่น</button>
</div>
</div>

<!-- ============ เช็คสถานะ ============ -->
<div id="p2" hidden>
  <div id="sf" class="c">
    <h1>🔎 เช็คสถานะงานซ่อม</h1>
    <label>รหัสงาน</label><input id="sc" autocomplete="off" autocapitalize="characters">
    <label>เบอร์โทร 4 ตัวท้าย</label><input id="stl" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="sgo">ดูสถานะ</button>
    <div id="smsg"></div>
  </div>

  <div id="rs" hidden>
    <div class="c">
      <div class="shop" id="sn"></div>
      <div class="rc" id="rcd"></div>
      <div id="rdv" style="margin-top:2px"></div>
      <span class="chip" id="rst"></span>
      <div id="rdue" style="margin-top:6px;color:#64748b;font-size:14px"></div>
    </div>

    <div class="c" id="lv" hidden>
      <b id="lvt"></b>
      <div id="m2"></div>
      <small id="lt"></small>
      <button class="s" id="rcn">🎯 จัดแผนที่ให้เห็นทั้งสองจุด</button>
    </div>

    <div class="c"><b>ความคืบหน้า</b><ul class="tl" id="tl"></ul></div>
    <button class="s" id="chg">ค้นงานอื่น</button>
    <p style="text-align:center;color:#94a3b8;font-size:13px">หน้านี้อัปเดตอัตโนมัติ</p>
  </div>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbwHQdrFAr3KtH6HK-pykwZlVFakeYpX2gwUzJb0q1yG5WdapTlf73qtyRyuGmSnsSN0/exec";
const CENTER=[17.4,104.77], ZOOM=12; // ปรับเป็นพิกัดร้านของคุณ
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const call=async b=>(await fetch(API,{method:'POST',body:JSON.stringify(b)})).json(); // text/plain → ผ่าน CORS ของ Apps Script
let pin=null,marker=null,circle=null,last='',lastPhone='';

/* ---------- แท็บ ---------- */
let ST=null; // timer ของหน้าสถานะ
function tab(n){
  $('p1').hidden=n!=1;$('p2').hidden=n!=2;
  $('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);
  if(n==1)map.invalidateSize();
  else if(LAST)smap&&setTimeout(()=>smap.invalidateSize(),60);
  if(n==1){clearTimeout(ST)}
  else if(LAST&&!busy)sload();
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* ---------- แจ้งซ่อม + GPS ---------- */
const map=L.map('map').setView(CENTER,ZOOM);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function setPin(ll){
  pin=ll;
  if(marker)marker.setLatLng(ll);
  else{marker=L.marker(ll,{draggable:true}).addTo(map);marker.on('dragend',()=>{pin=marker.getLatLng();if(circle){circle.remove();circle=null}})}
}
map.on('click',e=>{setPin(e.latlng);if(circle){circle.remove();circle=null}});

function gmsg(t,err){$('gm').textContent=t;$('gm').style.color=err?'#b91c1c':'#64748b'}
$('gps').onclick=()=>{
  if(!window.isSecureContext||!navigator.geolocation){
    gmsg('เบราว์เซอร์นี้ใช้ตำแหน่งไม่ได้ กรุณาแตะแผนที่เพื่อปักหมุดแทน',1);return}
  const b=$('gps');b.disabled=true;b.textContent='กำลังหาตำแหน่ง...';gmsg('กรุณากด "อนุญาต" เมื่อเบราว์เซอร์ถามขอตำแหน่ง');
  navigator.geolocation.getCurrentPosition(
    p=>{
      b.disabled=false;b.textContent='📍 ใช้ตำแหน่งปัจจุบันของฉัน';
      const ll=L.latLng(p.coords.latitude,p.coords.longitude);
      setPin(ll);map.setView(ll,17);
      if(circle)circle.remove();
      circle=L.circle(ll,{radius:p.coords.accuracy||30,weight:1}).addTo(map);
      gmsg('ได้ตำแหน่งแล้ว (คลาดเคลื่อนประมาณ '+Math.round(p.coords.accuracy||0)+' ม.) ลากหมุดปรับได้');
    },
    er=>{
      b.disabled=false;b.textContent='📍 ใช้ตำแหน่งปัจจุบันของฉัน';
      gmsg(er.code==1?'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ในการตั้งค่า หรือแตะแผนที่ปักหมุดเอง'
         :er.code==3?'หาตำแหน่งไม่ทันเวลา ลองใหม่ หรือแตะแผนที่ปักหมุดเอง'
         :'หาตำแหน่งไม่สำเร็จ แตะแผนที่เพื่อปักหมุดแทนได้',1);
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

function show(t,ok){$('msg').style.color=ok?'#64748b':'#b91c1c';$('msg').textContent=t}
$('go').onclick=async()=>{
  const nm=$('nm').value.trim(),ph=$('ph').value.trim(),dv=$('dv').value.trim(),ad=$('ad').value.trim();
  if($('hp').value)return;
  if(!nm||!ph||!dv||!ad)return show('กรุณากรอกข้อมูลที่มี * ให้ครบ');
  if(!/^[0-9+\-\s]{9,}$/.test(ph))return show('เบอร์โทรไม่ถูกต้อง');
  $('go').disabled=true;show('กำลังส่ง...',1);
  try{
    const r=await call({action:'create',userId:'',name:nm,phone:ph,device:dv,address:ad,
      lat:pin?pin.lat:null,lng:pin?pin.lng:null});
    if(r.ok){
      last=r.code;lastPhone=ph.replace(/\D/g,'').slice(-4);
      $('cd').textContent=r.code;
      $('f').hidden=true;$('done').hidden=false;window.scrollTo(0,0);show('',1);
    }else show('❌ '+(r.error||'ส่งไม่สำเร็จ'));
  }catch(e){show('❌ ส่งไม่สำเร็จ ลองใหม่อีกครั้ง')}
  $('go').disabled=false;
};
$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText(last);$('cp').textContent='✓ คัดลอกแล้ว'}
  catch(e){$('cp').textContent='แตะค้างที่รหัสเพื่อคัดลอก'}
};
$('tr').onclick=()=>{$('sc').value=last;$('stl').value=lastPhone;tab(2);sload(true)};
$('again').onclick=()=>{$('dv').value='';$('done').hidden=true;$('f').hidden=false;map.invalidateSize()};

/* ---------- เช็คสถานะ (ไทม์ไลน์ + แผนที่ไรเดอร์) ---------- */
const fmt=ms=>new Date(+ms).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' น.';
let busy=false,smap=null,rm=null,cm=null,fit=false,LAST=null;
function smsg(t,i){const e=$('smsg');e.textContent=t||'';e.style.color=i?'#64748b':'#b91c1c'}
function sview(on){$('rs').hidden=!on;$('sf').hidden=on}

async function sload(manual){
  const code=$('sc').value.trim().toUpperCase(),tail=$('stl').value.replace(/\D/g,'').slice(-4);
  if(!code||tail.length<4){if(manual)smsg('กรอกรหัสงานและเบอร์โทร 4 ตัวท้าย');return}
  if(busy)return;busy=true;clearTimeout(ST);
  if(manual)smsg('กำลังค้นหา...',1);
  try{
    const r=await call({action:'track',code:code,tail:tail});
    busy=false;
    if(!r||!r.ok){
      if(manual||!LAST){smsg((r&&r.error)||'ไม่พบข้อมูล');sview(false)}
      else ST=setTimeout(()=>sload(),15000);
      return;
    }
    try{localStorage.trk=JSON.stringify({code:code,tail:tail})}catch(e){}
    smsg('');render(r);
    if(!$('p2').hidden)ST=setTimeout(()=>sload(),r.live?8000:30000);
  }catch(e){
    busy=false;if(manual)smsg('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง');
    if(!$('p2').hidden)ST=setTimeout(()=>sload(),15000);
  }
}

function render(r){
  LAST=r;sview(true);
  $('sn').textContent=r.shop||'';
  $('rcd').textContent=r.code;
  $('rdv').textContent=r.device||'';
  const st=$('rst');st.textContent=(r.live?'🛵 ':'')+r.status;
  st.className='chip'+(r.live?' live':r.status==='ส่งมอบแล้ว'?' fin':'');
  $('rdue').textContent=r.due?'นัดรับ: '+r.due:'';

  const h=r.history||{};
  $('tl').innerHTML=r.steps.map((t,i)=>{
    if(t==='รออะไหล่'&&!h[i]&&i!==r.step)return '';
    const cls=i<r.step?'d':i===r.step?'n':'';
    const when=h[i]?fmt(h[i]):(i===0&&r.date?r.date:'');
    return '<li class="'+cls+'">'+esc(t)+(when?'<small>'+esc(when)+'</small>':'')+'</li>';
  }).join('');

  if(!r.live){$('lv').hidden=true;fit=false;if(rm){rm.remove();rm=null}return}
  $('lv').hidden=false;
  $('lvt').textContent=(r.status==='กำลังไปรับเครื่อง'?'🛵 ไรเดอร์กำลังไปรับเครื่องของคุณ':'🛵 ไรเดอร์กำลังนำเครื่องไปส่งคุณ')+(r.rider?' ('+r.rider+')':'');
  if(!smap){
    smap=L.map('m2').setView(CENTER,13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(smap);
  }
  setTimeout(()=>smap.invalidateSize(),60);
  if(r.pin){
    const p=[r.pin.lat,r.pin.lng];
    if(cm)cm.setLatLng(p);else cm=L.marker(p).addTo(smap).bindTooltip('จุดรับ-ส่ง');
  }
  if(r.loc){
    const ll=[r.loc.lat,r.loc.lng];
    if(rm)rm.setLatLng(ll);
    else rm=L.marker(ll,{icon:L.divIcon({html:'<div style="font-size:30px;line-height:34px">🛵</div>',className:'',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(smap);
    if(!fit){recenter();fit=true}
    const age=Math.max(0,Math.round((r.now-r.loc.t)/1000));
    $('lt').textContent=age<90?'อัปเดตเมื่อ '+age+' วินาทีที่แล้ว':'ตำแหน่งล่าสุดเมื่อ '+Math.round(age/60)+' นาทีที่แล้ว (ไรเดอร์อาจยังไม่ได้เปิดแชร์ตำแหน่ง)';
  }else{
    if(!fit){smap.setView(r.pin?[r.pin.lat,r.pin.lng]:CENTER,15);fit=true}
    $('lt').textContent='รอไรเดอร์เริ่มแชร์ตำแหน่ง...';
  }
}
function recenter(){
  if(!smap)return;
  const pts=[];
  if(rm)pts.push(rm.getLatLng());
  if(cm)pts.push(cm.getLatLng());
  if(pts.length>1)smap.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:17});
  else if(pts.length)smap.setView(pts[0],16);
}
$('rcn').onclick=recenter;
$('sgo').onclick=()=>sload(true);
$('stl').addEventListener('keydown',e=>{if(e.key==='Enter')sload(true)});
$('chg').onclick=()=>{clearTimeout(ST);LAST=null;sview(false)};

/* เปิดด้วยลิงก์ ?j=รหัสงาน → ไปหน้าเช็คสถานะเลย (จำเบอร์ 4 ตัวท้ายที่เคยกรอก) */
(function(){
  const j=(new URLSearchParams(location.search).get('j')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  let s={};try{s=JSON.parse(localStorage.trk||'{}')}catch(e){}
  if(j){
    $('sc').value=j;
    if(s.code===j)$('stl').value=s.tail||'';
    tab(2);
    if($('stl').value.length===4)sload(true);
  }else if(s.code){$('sc').value=s.code;$('stl').value=s.tail||''}
})();
</script>
</body></html>
