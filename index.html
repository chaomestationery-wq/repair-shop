<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แจ้งซ่อมมือถือ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Noto Sans Thai',sans-serif;background:#f4f6f8;color:#1b2430;font-size:16px}
.w{max-width:560px;margin:auto;padding:14px}
.c{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:#64748b;margin:0 0 8px;font-size:15px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dc;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:76px}
input:focus,textarea:focus{outline:0;border-color:#06c755;box-shadow:0 0 0 3px rgba(6,199,85,.15)}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#06c755;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.s{background:#eef1f5;color:#1b2430}
button:disabled{opacity:.6}
#map{height:260px;border-radius:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#msg{margin:10px 0 0;font-weight:600}
#gm{margin:8px 0 0;font-size:14px;color:#64748b}
.code{font-size:38px;font-weight:800;letter-spacing:4px;text-align:center;background:#effaf3;border:2px dashed #06c755;border-radius:14px;padding:14px;margin:12px 0;user-select:all}
.ok{text-align:center}.ok .ck{width:64px;height:64px;border-radius:50%;background:#16a34a;color:#fff;font-size:36px;line-height:64px;margin:4px auto 6px}
small{color:#64748b}
[hidden]{display:none!important}
</style></head><body><div class="w">

<div id="f" class="c">
  <h1>🔧 แจ้งซ่อมมือถือ</h1>
  <p class="sub">กรอกข้อมูล ร้านจะติดต่อกลับโดยเร็ว</p>
  <label>ชื่อ *</label><input id="nm" autocomplete="name" maxlength="80">
  <label>เบอร์โทร *</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20">
  <label>รุ่นเครื่อง / อาการเสีย *</label><textarea id="dv" maxlength="200" placeholder="เช่น iPhone 13 จอแตก"></textarea>
  <label>ที่อยู่สำหรับรับ-ส่ง *</label><textarea id="ad" maxlength="300"></textarea>
  <label>ปักหมุดตำแหน่ง (ไม่บังคับ)</label>
  <button type="button" class="s" id="gps" style="margin-top:0">📍 ใช้ตำแหน่งปัจจุบันของฉัน</button>
  <div id="gm">หรือแตะแผนที่ / ลากหมุดเพื่อเลือกตำแหน่งเอง</div>
  <div id="map" style="margin-top:8px"></div>
  <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="button" id="go">ส่งข้อมูลแจ้งซ่อม</button>
  <p id="msg"></p>
</div>

<div id="done" class="c ok" hidden>
  <div class="ck">✓</div>
  <h1>รับเรื่องแล้ว</h1>
  <p class="sub">รหัสงานของคุณ (กรุณาจดหรือแคปหน้าจอไว้)</p>
  <div class="code" id="cd"></div>
  <button type="button" id="cp">📋 คัดลอกรหัส</button>
  <button type="button" class="s" id="tr">🔎 ดูสถานะงาน</button>
  <p><small>เช็คสถานะได้ทุกเมื่อ โดยใช้รหัสงาน + เบอร์โทร 4 ตัวท้าย</small></p>
  <button type="button" class="s" id="again">แจ้งซ่อมเครื่องอื่น</button>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbwHQdrFAr3KtH6HK-pykwZlVFakeYpX2gwUzJb0q1yG5WdapTlf73qtyRyuGmSnsSN0/exec";
const CENTER=[17.4,104.77], ZOOM=12; // ปรับเป็นพิกัดร้านของคุณ
const $=i=>document.getElementById(i);
let pin=null,marker=null,circle=null,last='';

const map=L.map('map').setView(CENTER,ZOOM);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function setPin(ll){
  pin=ll;
  if(marker)marker.setLatLng(ll);
  else{marker=L.marker(ll,{draggable:true}).addTo(map);marker.on('dragend',()=>{pin=marker.getLatLng();if(circle){circle.remove();circle=null}})}
}
map.on('click',e=>{setPin(e.latlng);if(circle){circle.remove();circle=null}});

function gmsg(t,err){$('gm').textContent=t;$('gm').style.color=err?'#b91c1c':'#64748b'}
$('gps').onclick=()=>{
  if(!window.isSecureContext||!navigator.geolocation){
    gmsg('เบราว์เซอร์นี้ใช้ตำแหน่งไม่ได้ กรุณาแตะแผนที่เพื่อปักหมุดแทน',1);return}
  const b=$('gps');b.disabled=true;b.textContent='กำลังหาตำแหน่ง...';gmsg('กรุณากด "อนุญาต" เมื่อเบราว์เซอร์ถามขอตำแหน่ง');
  navigator.geolocation.getCurrentPosition(
    p=>{
      b.disabled=false;b.textContent='📍 ใช้ตำแหน่งปัจจุบันของฉัน';
      const ll=L.latLng(p.coords.latitude,p.coords.longitude);
      setPin(ll);map.setView(ll,17);
      if(circle)circle.remove();
      circle=L.circle(ll,{radius:p.coords.accuracy||30,weight:1}).addTo(map);
      gmsg('ได้ตำแหน่งแล้ว (คลาดเคลื่อนประมาณ '+Math.round(p.coords.accuracy||0)+' ม.) ลากหมุดปรับได้');
    },
    er=>{
      b.disabled=false;b.textContent='📍 ใช้ตำแหน่งปัจจุบันของฉัน';
      gmsg(er.code==1?'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ในการตั้งค่า หรือแตะแผนที่ปักหมุดเอง'
         :er.code==3?'หาตำแหน่งไม่ทันเวลา ลองใหม่ หรือแตะแผนที่ปักหมุดเอง'
         :'หาตำแหน่งไม่สำเร็จ แตะแผนที่เพื่อปักหมุดแทนได้',1);
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0});
};

function show(t,ok){$('msg').style.color=ok?'#64748b':'#b91c1c';$('msg').textContent=t}
$('go').onclick=async()=>{
  const nm=$('nm').value.trim(),ph=$('ph').value.trim(),dv=$('dv').value.trim(),ad=$('ad').value.trim();
  if($('hp').value)return;
  if(!nm||!ph||!dv||!ad)return show('กรุณากรอกข้อมูลที่มี * ให้ครบ');
  if(!/^[0-9+\-\s]{9,}$/.test(ph))return show('เบอร์โทรไม่ถูกต้อง');
  $('go').disabled=true;show('กำลังส่ง...',1);
  try{
    // ส่งเป็น text/plain (ไม่ตั้ง Content-Type) เพื่อให้ผ่าน CORS ของ Apps Script ได้
    const r=await(await fetch(API,{method:'POST',body:JSON.stringify({
      action:'create',userId:'',name:nm,phone:ph,device:dv,address:ad,
      lat:pin?pin.lat:null,lng:pin?pin.lng:null})})).json();
    if(r.ok){
      last=r.code;$('cd').textContent=r.code;
      $('f').hidden=true;$('done').hidden=false;window.scrollTo(0,0);show('',1);
    }else show('❌ '+(r.error||'ส่งไม่สำเร็จ'));
  }catch(e){show('❌ ส่งไม่สำเร็จ ลองใหม่อีกครั้ง')}
  $('go').disabled=false;
};

$('cp').onclick=async()=>{
  try{await navigator.clipboard.writeText(last);$('cp').textContent='✓ คัดลอกแล้ว'}
  catch(e){$('cp').textContent='แตะค้างที่รหัสเพื่อคัดลอก'}
};
$('tr').onclick=()=>window.open(API+'?j='+encodeURIComponent(last),'_blank');
$('again').onclick=()=>{$('dv').value='';$('done').hidden=true;$('f').hidden=false;map.invalidateSize()};
</script>
</body></html>
